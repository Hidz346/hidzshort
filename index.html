<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <title>HidzShort | Pendekin Link & QR Code</title>
        <meta name="theme-color" content="#09090f" />
        <meta
            name="description"
            content="Pendekin link kepanjangan jadi rapi, langsung dapet QR code-nya juga. Gratis, tanpa iklan."
        />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="HidzShort | Pendekin Link & QR Code" />
        <meta
            property="og:description"
            content="Pendekin link kepanjangan jadi rapi, langsung dapet QR code-nya juga."
        />
        <meta property="og:image" content="https://www.gobox.my.id/file/vVUoB.png" />
        <link rel="icon" type="image/jpeg" href="https://www.gobox.my.id/file/vVUoB.png" />
        <link rel="apple-touch-icon" href="https://www.gobox.my.id/file/vVUoB.png" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap"
        />

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
            }
            input {
                -webkit-user-select: auto !important;
                user-select: auto !important;
            }

            :root {
                --primary: #6a3fc8;
                --secondary: #3366d9;
                --bg: #f5f0e8;
                --surface: #fffef9;
                --text: #0a0a0a;
                --text-secondary: #333333;
                --border: #0a0a0a;
                --shadow-sm: 4px 4px 0px #0a0a0a;
                --shadow-md: 5px 5px 0px #0a0a0a;
                --chip-bg: #ffe94d;
                --y2k-accent: #ff69b4;
                --y2k-lime: #b8ff00;
                --y2k-cyan: #00e5ff;
            }
            :root.dark {
                --bg: #1a1a1a;
                --surface: #232323;
                --text: #f5f0e8;
                --text-secondary: #cccccc;
                --border: #f5f0e8;
                --shadow-sm: 4px 4px 0px #f5f0e8;
                --shadow-md: 5px 5px 0px #f5f0e8;
                --chip-bg: #3a3a1a;
                --y2k-accent: #ff8dc7;
                --y2k-lime: #c8ff3f;
                --y2k-cyan: #3df0ff;
            }

            body {
                font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
                background: var(--bg);
                min-height: 100vh;
                overflow-x: hidden;
                transition: background 0.3s;
                -webkit-user-select: none;
                user-select: none;
            }

            .app-container {
                width: 100%;
                min-height: 100vh;
                min-height: 100dvh;
                background: var(--surface);
                display: flex;
                flex-direction: column;
                transition: background 0.3s;
            }

            /* ===== Header ===== */
            .hs-header {
                padding: 14px 18px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                border-bottom: 3px solid var(--border);
                background: var(--surface);
                position: sticky;
                top: 0;
                z-index: 20;
                transition: background 0.3s, border-color 0.3s;
            }
            .hs-brand {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .hs-brand img {
                width: 32px;
                height: 32px;
                object-fit: cover;
                border: 2px solid var(--border);
                box-shadow: 2px 2px 0px var(--border);
            }
            .hs-brand-text {
                display: flex;
                flex-direction: column;
                line-height: 1.1;
            }
            .hs-brand-text strong {
                font-family: "Orbitron", sans-serif;
                font-size: 16px;
                font-weight: 900;
                color: var(--text);
                letter-spacing: 0.3px;
            }
            .hs-brand-text span {
                font-size: 10px;
                font-weight: 700;
                color: var(--text-secondary);
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            .icon-btn {
                width: 36px;
                height: 36px;
                border-radius: 0;
                border: 2px solid var(--border);
                background: var(--surface);
                color: var(--text);
                font-size: 14px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 3px 3px 0px var(--border);
                transition: 0.15s;
            }
            .icon-btn:active {
                transform: translate(2px, 2px);
                box-shadow: 1px 1px 0px var(--border);
            }

            /* ===== Main ===== */
            .hs-main {
                flex: 1;
                padding: 24px 18px 60px;
                max-width: 480px;
                width: 100%;
                margin: 0 auto;
            }

            .hs-hero {
                margin-bottom: 22px;
            }
            .hs-hero h1 {
                font-family: "Orbitron", sans-serif;
                font-size: 22px;
                font-weight: 900;
                line-height: 1.3;
                color: var(--text);
            }
            .hs-hero h1 .hl {
                background: var(--y2k-lime);
                padding: 0 6px;
                box-shadow: 3px 3px 0px var(--border);
                display: inline-block;
                transform: rotate(-1deg);
                margin-top: 4px;
            }
            .hs-hero p {
                margin-top: 10px;
                font-size: 13px;
                font-weight: 600;
                color: var(--text-secondary);
            }

            /* ===== Form Card ===== */
            .hs-card {
                background: var(--surface);
                border: 2.5px solid var(--border);
                box-shadow: var(--shadow-md);
                padding: 18px;
                transition: background 0.3s;
            }
            .hs-field {
                margin-bottom: 12px;
            }
            .hs-field label {
                display: block;
                font-size: 11px;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                color: var(--text-secondary);
                margin-bottom: 6px;
            }
            .hs-input {
                width: 100%;
                padding: 13px 14px;
                font-family: "Space Grotesk", sans-serif;
                font-size: 14px;
                font-weight: 600;
                color: var(--text);
                background: var(--bg);
                border: 2.5px solid var(--border);
                border-radius: 0;
                outline: none;
                transition: box-shadow 0.15s;
            }
            .hs-input:focus {
                box-shadow: 3px 3px 0px var(--border);
            }
            .hs-alias-group {
                display: flex;
                border: 2.5px solid var(--border);
                background: var(--bg);
            }
            .hs-alias-prefix {
                flex-shrink: 0;
                display: flex;
                align-items: center;
                padding: 0 10px;
                font-size: 12px;
                font-weight: 700;
                color: var(--text-secondary);
                background: var(--chip-bg);
                border-right: 2.5px solid var(--border);
                max-width: 46%;
                overflow: hidden;
                white-space: nowrap;
                text-overflow: ellipsis;
            }
            .hs-alias-group input {
                border: none;
                background: transparent;
                flex: 1;
                min-width: 0;
                padding: 13px 12px;
                font-family: "Space Grotesk", sans-serif;
                font-size: 14px;
                font-weight: 600;
                color: var(--text);
                outline: none;
            }
            .hs-hint {
                font-size: 10.5px;
                color: var(--text-secondary);
                margin-top: 5px;
                font-weight: 600;
            }

            .hs-submit {
                width: 100%;
                padding: 15px;
                margin-top: 4px;
                border: 2.5px solid var(--border);
                background: var(--primary);
                color: #fff;
                font-family: "Orbitron", sans-serif;
                font-weight: 700;
                font-size: 13px;
                letter-spacing: 0.5px;
                text-transform: uppercase;
                cursor: pointer;
                box-shadow: var(--shadow-sm);
                transition: 0.15s;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }
            .hs-submit:active {
                transform: translate(3px, 3px);
                box-shadow: 1px 1px 0px var(--border);
            }
            .hs-submit:disabled {
                opacity: 0.65;
                cursor: default;
            }

            /* ===== Result — sticker style ===== */
            .hs-result {
                margin-top: 22px;
                display: none;
            }
            .hs-result.show {
                display: block;
                animation: hsPop 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.3) both;
            }
            @keyframes hsPop {
                from { opacity: 0; transform: scale(0.92) translateY(8px); }
                to { opacity: 1; transform: scale(1) translateY(0); }
            }
            .hs-sticker {
                position: relative;
                background: var(--surface);
                border: 2.5px dashed var(--border);
                padding: 22px 18px 18px;
                transform: rotate(-1deg);
                box-shadow: var(--shadow-md);
            }
            .hs-tape {
                position: absolute;
                top: -12px;
                left: 20px;
                width: 70px;
                height: 22px;
                background: var(--y2k-accent);
                opacity: 0.85;
                border: 1.5px solid var(--border);
                transform: rotate(-4deg);
            }
            .hs-scan-tab {
                position: absolute;
                top: -13px;
                right: 14px;
                background: var(--y2k-lime);
                border: 2px solid var(--border);
                padding: 4px 10px;
                font-family: "Orbitron", sans-serif;
                font-size: 10px;
                font-weight: 900;
                transform: rotate(3deg);
                box-shadow: 2px 2px 0px var(--border);
            }
            .hs-qr-wrap {
                display: flex;
                justify-content: center;
                margin: 6px 0 16px;
            }
            .hs-qr-box {
                background: #fff;
                padding: 10px;
                border: 2.5px solid var(--border);
                line-height: 0;
            }
            .hs-short-link-row {
                display: flex;
                align-items: center;
                gap: 8px;
                background: var(--bg);
                border: 2px solid var(--border);
                padding: 10px 12px;
                margin-bottom: 14px;
            }
            .hs-short-link-row span {
                flex: 1;
                min-width: 0;
                font-weight: 800;
                font-size: 13px;
                color: var(--primary);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .hs-short-link-row button {
                flex-shrink: 0;
                width: 34px;
                height: 34px;
                border: 2px solid var(--border);
                background: var(--surface);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 2px 2px 0px var(--border);
            }
            .hs-short-link-row button:active {
                transform: translate(2px, 2px);
                box-shadow: 0px 0px 0px var(--border);
            }
            .hs-live-clicks {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                margin-bottom: 14px;
                font-size: 11px;
                font-weight: 800;
                color: var(--text-secondary);
                text-transform: uppercase;
                letter-spacing: 0.4px;
            }
            .hs-live-dot {
                width: 7px;
                height: 7px;
                flex-shrink: 0;
                border-radius: 50%;
                background: #ff3b3b;
                border: 1.5px solid var(--border);
                animation: hsLiveBlink 1.4s ease-in-out infinite;
            }
            @keyframes hsLiveBlink {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.25; }
            }
            .hs-result-actions {
                display: flex;
                gap: 8px;
            }
            .hs-result-actions .btn-action {
                flex: 1;
                padding: 11px;
                font-size: 12px;
                border: 2.5px solid var(--border);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 0.3px;
                box-shadow: var(--shadow-sm);
                transition: 0.15s;
            }
            .btn-action.primary { background: var(--primary); color: #fff; }
            .btn-action.wa { background: #25d366; color: #fff; }
            .btn-action.secondary { background: var(--surface); color: var(--text); }
            .btn-action:active {
                transform: translate(2px, 2px);
                box-shadow: 1px 1px 0px var(--border);
            }
            .hs-reset-link {
                display: block;
                text-align: center;
                margin-top: 14px;
                font-size: 12px;
                font-weight: 700;
                color: var(--text-secondary);
                text-decoration: underline;
                cursor: pointer;
                background: none;
                border: none;
            }

            /* ===== History ===== */
            .hs-history {
                margin-top: 32px;
            }
            .hs-history h2 {
                font-family: "Orbitron", sans-serif;
                font-size: 13px;
                font-weight: 700;
                color: var(--text);
                text-transform: uppercase;
                letter-spacing: 0.5px;
                margin-bottom: 12px;
            }
            .hs-history-list {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .hs-item-row {
                display: flex;
                align-items: center;
                background: var(--surface);
                padding: 12px;
                gap: 10px;
                border: 2.5px solid var(--border);
                box-shadow: var(--shadow-sm);
                cursor: pointer;
                transition: transform 0.15s, box-shadow 0.15s, background 0.3s;
            }
            .hs-item-row:active {
                transform: translate(3px, 3px);
                box-shadow: 1px 1px 0px var(--border);
            }
            .hs-item-info {
                flex: 1;
                min-width: 0;
            }
            .hs-item-slug {
                font-weight: 800;
                font-size: 13px;
                color: var(--primary);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .hs-item-url {
                font-size: 11px;
                color: var(--text-secondary);
                margin-top: 2px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                font-weight: 600;
            }
            .hs-item-clicks {
                flex-shrink: 0;
                font-size: 10px;
                font-weight: 800;
                color: var(--text);
                background: var(--chip-bg);
                border: 1.5px solid var(--border);
                padding: 3px 7px;
                white-space: nowrap;
            }
            .hs-clicks-bump {
                animation: hsClickBump 0.4s ease;
            }
            @keyframes hsClickBump {
                0% { transform: scale(1); }
                40% { transform: scale(1.25); }
                100% { transform: scale(1); }
            }
            .hs-item-del {
                flex-shrink: 0;
                width: 30px;
                height: 30px;
                border: none;
                background: transparent;
                color: var(--text-secondary);
                font-size: 13px;
                cursor: pointer;
            }
            .hs-empty {
                text-align: center;
                padding: 28px 16px;
                border: 2.5px dashed var(--border);
                color: var(--text-secondary);
            }
            .hs-empty i {
                font-size: 22px;
                margin-bottom: 8px;
                display: block;
                opacity: 0.5;
            }
            .hs-empty span {
                font-size: 12px;
                font-weight: 600;
            }

            /* ===== Toast ===== */
            .hz-toast {
                position: fixed;
                left: 50%;
                bottom: 24px;
                transform: translateX(-50%) translateY(10px);
                background: var(--text);
                color: var(--bg);
                font-size: 12px;
                font-weight: 800;
                padding: 10px 18px;
                border: 2.5px solid var(--border);
                box-shadow: var(--shadow-sm);
                z-index: 5000;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s, transform 0.2s;
                white-space: nowrap;
                max-width: 90vw;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .hz-toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

            /* ===== Redirect overlay (dipakai pas orang buka /slug) ===== */
            .hs-redirect-overlay {
                position: fixed;
                inset: 0;
                background: var(--bg);
                display: none;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                padding: 24px;
                z-index: 9999;
                text-align: center;
            }
            .hs-redirect-overlay.show { display: flex; }
            .hs-redirect-overlay img {
                width: 56px;
                height: 56px;
                border: 2.5px solid var(--border);
                box-shadow: var(--shadow-sm);
                animation: hsPulse 1.1s ease-in-out infinite;
            }
            @keyframes hsPulse {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.08); }
            }
            .hs-redirect-overlay p {
                font-size: 13px;
                font-weight: 700;
                color: var(--text-secondary);
                max-width: 260px;
            }
            .hs-redirect-overlay .hs-nf-icon {
                font-size: 34px;
                color: var(--text-secondary);
            }
            .hs-redirect-overlay .btn-action {
                margin-top: 4px;
            }

            @media (prefers-reduced-motion: reduce) {
                *, *::before, *::after { animation: none !important; transition: none !important; }
            }
        </style>
    </head>
    <body>
        <div class="app-container" id="appContainer">
            <div class="hs-header">
                <div class="hs-brand">
                    <img src="https://www.gobox.my.id/file/vVUoB.png" alt="HidzShort" />
                    <div class="hs-brand-text">
                        <strong>HidzShort</strong>
                        <span>by HidzProject</span>
                    </div>
                </div>
                <button class="icon-btn" id="btnTheme" title="Ganti tema">
                    <i class="fas fa-moon"></i>
                </button>
            </div>

            <div class="hs-main">
                <div class="hs-hero">
                    <h1>Link kepanjangan?<br /><span class="hl">Pendekin sini.</span></h1>
                    <p>Tempel link-nya, kelar — langsung dapet link pendek plus QR code buat di-scan. Gratis, nggak pake iklan.</p>
                </div>

                <form class="hs-card" id="shortenForm">
                    <div class="hs-field">
                        <label for="urlInput">Link tujuan</label>
                        <input
                            type="text"
                            id="urlInput"
                            class="hs-input"
                            placeholder="https://contoh.com/artikel-panjang-banget"
                            autocomplete="off"
                            autocapitalize="off"
                            spellcheck="false"
                        />
                    </div>
                    <div class="hs-field">
                        <label for="aliasInput">Nama custom (opsional)</label>
                        <div class="hs-alias-group">
                            <span class="hs-alias-prefix" id="aliasPrefix">/</span>
                            <input
                                type="text"
                                id="aliasInput"
                                placeholder="promo-agustus"
                                autocomplete="off"
                                autocapitalize="off"
                                spellcheck="false"
                                maxlength="32"
                            />
                        </div>
                        <div class="hs-hint">Kosongin aja kalau mau di-generate otomatis</div>
                    </div>
                    <button type="submit" class="hs-submit" id="submitBtn">
                        <i class="fas fa-scissors"></i> Pendekin Link
                    </button>
                </form>

                <div class="hs-result" id="resultBlock">
                    <div class="hs-sticker">
                        <div class="hs-tape"></div>
                        <div class="hs-scan-tab">SCAN ME</div>
                        <div class="hs-qr-wrap">
                            <div class="hs-qr-box" id="qrContainer"></div>
                        </div>
                        <div class="hs-short-link-row">
                            <span id="resultLinkText">-</span>
                            <button type="button" id="btnCopyLink" title="Salin link">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                        <div class="hs-live-clicks">
                            <span class="hs-live-dot" aria-hidden="true"></span>
                            <span id="resultClicksCount" data-slug="">- klik</span>
                        </div>
                        <div class="hs-result-actions">
                            <button type="button" class="btn-action wa" id="btnShareWa">
                                <i class="fab fa-whatsapp"></i> Bagikan
                            </button>
                            <button type="button" class="btn-action secondary" id="btnDownloadQr">
                                <i class="fas fa-download"></i> Simpan QR
                            </button>
                        </div>
                    </div>
                    <button type="button" class="hs-reset-link" id="btnResetForm">Pendekin link lain</button>
                </div>

                <div class="hs-history">
                    <h2>Riwayat Kamu</h2>
                    <div class="hs-history-list" id="historyList"></div>
                </div>
            </div>
        </div>

        <div class="hs-redirect-overlay" id="redirectOverlay">
            <img src="https://www.gobox.my.id/file/vVUoB.png" alt="" id="redirectLogo" />
            <p id="redirectText">Nyari tujuan link kamu...</p>
        </div>

        <div class="hz-toast" id="hzToast"></div>

        <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <script>
            // =====================================================================
            //  HidzShort — link shortener + QR generator
            //  Datanya disimpen di Supabase, tabel "hidz_short_links". Baca &
            //  bikin link pakai anon key (dibatasi RLS policy read + insert
            //  doang), sementara nambah klik lewat RPC function biar tetep
            //  atomik walau ada beberapa orang klik bareng.
            // =====================================================================
            var _sbCfg = {
                url: "https://wgtycfvtpdbgqutyhttv.supabase.co",
                anonKey: "sb_publishable_AU6d50pWQm5uioyim_yIuQ_T_gaVJbD",
            };
            var sb = supabase.createClient(_sbCfg.url, _sbCfg.anonKey);
            var TABLE = "hidz_short_links";
            var SITE_ORIGIN = window.location.origin;
            var HISTORY_KEY = "hidzshort_history";

            /* ---- Tema gelap/terang, disimpen di localStorage ---- */
            (function initTheme() {
                var saved = localStorage.getItem("hidzshort_theme");
                if (saved === "dark") document.documentElement.classList.add("dark");
                updateThemeIcon();
            })();
            function updateThemeIcon() {
                var icon = document.querySelector("#btnTheme i");
                var isDark = document.documentElement.classList.contains("dark");
                icon.className = isDark ? "fas fa-sun" : "fas fa-moon";
            }
            document.getElementById("btnTheme").addEventListener("click", function () {
                document.documentElement.classList.toggle("dark");
                localStorage.setItem(
                    "hidzshort_theme",
                    document.documentElement.classList.contains("dark") ? "dark" : "light"
                );
                updateThemeIcon();
            });

            /* ---- Toast ringan, sama persis polanya kayak di HidzProject ---- */
            function showToast(msg) {
                var el = document.getElementById("hzToast");
                el.textContent = msg;
                el.classList.add("show");
                clearTimeout(showToast._t);
                showToast._t = setTimeout(function () {
                    el.classList.remove("show");
                }, 2400);
            }

            function copyText(text, successMsg) {
                var fallback = function () {
                    try {
                        var ta = document.createElement("textarea");
                        ta.value = text;
                        ta.style.position = "fixed";
                        ta.style.opacity = "0";
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand("copy");
                        document.body.removeChild(ta);
                        showToast(successMsg);
                    } catch (e) {
                        showToast("Gagal menyalin");
                    }
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function () {
                        showToast(successMsg);
                    }).catch(fallback);
                } else {
                    fallback();
                }
            }

            /* ---- Prefix "domain kamu /" di field alias, ngikutin domain asli tempat file ini di-hosting ---- */
            document.getElementById("aliasPrefix").textContent =
                SITE_ORIGIN.replace(/^https?:\/\//, "") + "/";

            /* =====================================================================
               REDIRECT RESOLVER — jalan kalau ada orang buka hidzshort.xxx/slug
               ===================================================================== */
            function currentSlug() {
                return decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, ""));
            }
            function resolveRedirectIfNeeded() {
                var slug = currentSlug();
                if (!slug) return;

                document.getElementById("appContainer").style.display = "none";
                var overlay = document.getElementById("redirectOverlay");
                overlay.classList.add("show");

                sb.rpc("hidz_short_resolve", { p_slug: slug })
                    .then(function (res) {
                        if (res.error) throw res.error;
                        var row = res.data && res.data[0];
                        if (row && row.url) {
                            setTimeout(function () {
                                location.href = row.url;
                            }, 350);
                        } else {
                            showNotFound();
                        }
                    })
                    .catch(function () {
                        showNotFound();
                    });
            }
            function showNotFound() {
                var overlay = document.getElementById("redirectOverlay");
                document.getElementById("redirectLogo").style.display = "none";
                document.getElementById("redirectText").innerHTML =
                    '<i class="fas fa-link-slash hs-nf-icon"></i><br><br>Link ini nggak ketemu, mungkin udah dihapus.';
                var btn = document.createElement("button");
                btn.className = "btn-action primary";
                btn.style.marginTop = "12px";
                btn.innerHTML = '<i class="fas fa-house"></i> Buat Link Baru';
                btn.onclick = function () {
                    location.href = SITE_ORIGIN + "/";
                };
                overlay.appendChild(btn);
            }
            resolveRedirectIfNeeded();

            /* =====================================================================
               RIWAYAT LOKAL — disimpen di HP masing-masing (localStorage), bukan
               ditarik dari Supabase, biar nggak perlu sistem login segala.
               ===================================================================== */
            function getHistory() {
                try {
                    return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
                } catch (e) {
                    return [];
                }
            }
            function saveHistory(list) {
                localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 30)));
            }
            function addToHistory(entry) {
                var list = getHistory();
                list.unshift(entry);
                saveHistory(list);
                renderHistory();
            }
            function removeFromHistory(slug) {
                var list = getHistory().filter(function (item) {
                    return item.slug !== slug;
                });
                saveHistory(list);
                renderHistory();
                showToast("Dihapus dari riwayat");
            }

            function renderHistory() {
                var list = getHistory();
                var wrap = document.getElementById("historyList");
                wrap.innerHTML = "";

                if (list.length === 0) {
                    wrap.innerHTML =
                        '<div class="hs-empty"><i class="fas fa-link"></i><span>Belum ada link yang dipendekin. Riwayat kamu bakal muncul di sini.</span></div>';
                    return;
                }

                list.forEach(function (item) {
                    var row = document.createElement("div");
                    row.className = "hs-item-row";
                    row.innerHTML =
                        '<div class="hs-item-info">' +
                        '<div class="hs-item-slug">/' + escapeHtml(item.slug) + "</div>" +
                        '<div class="hs-item-url">' + escapeHtml(item.url) + "</div>" +
                        "</div>" +
                        '<span class="hs-item-clicks" data-slug="' + escapeHtml(item.slug) + '">- klik</span>' +
                        '<button type="button" class="hs-item-del" title="Hapus dari riwayat"><i class="fas fa-trash-alt"></i></button>';

                    row.querySelector(".hs-item-del").addEventListener("click", function (e) {
                        e.stopPropagation();
                        removeFromHistory(item.slug);
                    });
                    row.addEventListener("click", function () {
                        openResult(item.slug, item.url);
                        document.getElementById("resultBlock").scrollIntoView({ behavior: "smooth", block: "center" });
                    });
                    wrap.appendChild(row);

                    // Ambil jumlah klik terbaru dari Supabase, tampilnya nyusul biar nggak nunggu
                    sb.from(TABLE)
                        .select("clicks")
                        .eq("slug", item.slug)
                        .maybeSingle()
                        .then(function (res) {
                            var el = wrap.querySelector('.hs-item-clicks[data-slug="' + cssEscape(item.slug) + '"]');
                            if (el) el.textContent = ((res.data && res.data.clicks) || 0) + " klik";
                        })
                        .catch(function () {});
                });
            }
            function escapeHtml(str) {
                var d = document.createElement("div");
                d.textContent = str == null ? "" : String(str);
                return d.innerHTML;
            }
            function cssEscape(str) {
                return String(str).replace(/["\\]/g, "\\$&");
            }

            /* =====================================================================
               FORM PENDEKIN LINK
               ===================================================================== */
            var ALIAS_RE = /^[a-zA-Z0-9_-]{3,32}$/;
            var RESERVED = ["", "index.html", "favicon.ico", "manifest.json"];

            function normalizeUrl(raw) {
                var v = raw.trim();
                if (!v) return null;
                if (!/^https?:\/\//i.test(v)) v = "https://" + v;
                try {
                    var u = new URL(v);
                    return u.href;
                } catch (e) {
                    return null;
                }
            }

            function randomSlug(len) {
                var chars = "abcdefghijklmnopqrstuvwxyz0123456789";
                var out = "";
                for (var i = 0; i < len; i++) {
                    out += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return out;
            }

            function slugExists(slug) {
                return sb
                    .from(TABLE)
                    .select("slug", { count: "exact", head: true })
                    .eq("slug", slug)
                    .then(function (res) {
                        if (res.error) throw res.error;
                        return (res.count || 0) > 0;
                    });
            }

            function generateUniqueSlug() {
                var attempt = function (triesLeft, len) {
                    var candidate = randomSlug(len);
                    return slugExists(candidate).then(function (exists) {
                        if (!exists) return candidate;
                        if (triesLeft <= 0) return randomSlug(len + 2);
                        return attempt(triesLeft - 1, len);
                    });
                };
                return attempt(5, 6);
            }

            document.getElementById("shortenForm").addEventListener("submit", function (e) {
                e.preventDefault();

                var rawUrl = document.getElementById("urlInput").value;
                var rawAlias = document.getElementById("aliasInput").value.trim();
                var submitBtn = document.getElementById("submitBtn");

                var normalized = normalizeUrl(rawUrl);
                if (!normalized) {
                    showToast("Link-nya kayaknya belum valid nih");
                    return;
                }
                if (normalized.indexOf(SITE_ORIGIN) === 0) {
                    showToast("Nggak bisa mendekin link HidzShort sendiri");
                    return;
                }
                if (rawAlias && !ALIAS_RE.test(rawAlias)) {
                    showToast("Nama custom 3-32 karakter, huruf/angka/strip aja");
                    return;
                }
                if (rawAlias && RESERVED.indexOf(rawAlias.toLowerCase()) !== -1) {
                    showToast("Nama itu nggak bisa dipakai, coba yang lain");
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';

                var slugPromise;
                if (rawAlias) {
                    slugPromise = slugExists(rawAlias).then(function (exists) {
                        if (exists) throw new Error("ALIAS_TAKEN");
                        return rawAlias;
                    });
                } else {
                    slugPromise = generateUniqueSlug();
                }

                slugPromise
                    .then(function (slug) {
                        return sb
                            .from(TABLE)
                            .insert({ slug: slug, url: normalized })
                            .then(function (res) {
                                if (res.error) throw res.error;
                                return slug;
                            });
                    })
                    .then(function (slug) {
                        addToHistory({ slug: slug, url: normalized, createdAt: Date.now() });
                        openResult(slug, normalized);
                        document.getElementById("shortenForm").reset();
                        showToast("Link berhasil dipendekin!");
                    })
                    .catch(function (err) {
                        if (err && err.message === "ALIAS_TAKEN") {
                            showToast("Nama itu udah dipakai, coba yang lain ya");
                        } else {
                            showToast("Gagal simpan link, coba lagi");
                            console.error("HidzShort error:", err);
                        }
                    })
                    .finally(function () {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-scissors"></i> Pendekin Link';
                    });
            });

            function openResult(slug, originalUrl) {
                var shortLink = SITE_ORIGIN + "/" + slug;
                document.getElementById("resultLinkText").textContent =
                    shortLink.replace(/^https?:\/\//, "");
                document.getElementById("resultBlock").dataset.shortLink = shortLink;
                document.getElementById("resultBlock").dataset.originalUrl = originalUrl;

                var qrBox = document.getElementById("qrContainer");
                qrBox.innerHTML = "";
                var qrCanvas = document.createElement("canvas");
                qrBox.appendChild(qrCanvas);
                QRCode.toCanvas(
                    qrCanvas,
                    shortLink,
                    {
                        width: 168,
                        errorCorrectionLevel: "M",
                        color: { dark: "#0a0a0a", light: "#ffffff" },
                    },
                    function (err) {
                        if (err) console.error("HidzShort QR error:", err);
                    }
                );

                // Tandain elemen ini punya link yang mana, biar listener realtime
                // di bawah tau elemen mana yang mesti diupdate pas ada yang klik
                var clicksEl = document.getElementById("resultClicksCount");
                clicksEl.textContent = "- klik";
                clicksEl.dataset.slug = slug;
                sb.from(TABLE)
                    .select("clicks")
                    .eq("slug", slug)
                    .maybeSingle()
                    .then(function (res) {
                        if (clicksEl.dataset.slug !== slug) return;
                        clicksEl.textContent = ((res.data && res.data.clicks) || 0) + " klik";
                    })
                    .catch(function () {});

                document.getElementById("resultBlock").classList.add("show");
            }

            document.getElementById("btnCopyLink").addEventListener("click", function () {
                var link = document.getElementById("resultBlock").dataset.shortLink || "";
                copyText(link, "Link disalin ke clipboard");
            });

            document.getElementById("btnShareWa").addEventListener("click", function () {
                var link = document.getElementById("resultBlock").dataset.shortLink || "";
                var msg = "\u2728 Cek link ini: " + link + "\n\n(dipendekin pake HidzShort)";
                window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
            });

            document.getElementById("btnDownloadQr").addEventListener("click", function () {
                var canvas = document.querySelector("#qrContainer canvas");
                if (!canvas) {
                    showToast("QR belum siap, coba lagi sebentar");
                    return;
                }
                var slug = (document.getElementById("resultBlock").dataset.shortLink || "qr").split("/").pop();
                var a = document.createElement("a");
                a.href = canvas.toDataURL("image/png");
                a.download = "hidzshort-" + slug + ".png";
                a.click();
            });

            document.getElementById("btnResetForm").addEventListener("click", function () {
                document.getElementById("resultBlock").classList.remove("show");
                document.getElementById("urlInput").focus();
            });

            renderHistory();

            /* =====================================================================
               REALTIME KLIK — dengerin perubahan tabel dari Supabase biar angka
               klik di riwayat & di kartu hasil auto keupdate sendiri tiap ada
               yang buka link pendeknya, tanpa perlu reload halaman.
               ===================================================================== */
            sb.channel("hidz_short_links_clicks")
                .on(
                    "postgres_changes",
                    { event: "UPDATE", schema: "public", table: TABLE },
                    function (payload) {
                        var row = payload.new;
                        if (!row || !row.slug) return;
                        var nodes = document.querySelectorAll('[data-slug="' + cssEscape(row.slug) + '"]');
                        nodes.forEach(function (el) {
                            el.textContent = (row.clicks || 0) + " klik";
                            el.classList.remove("hs-clicks-bump");
                            void el.offsetWidth;
                            el.classList.add("hs-clicks-bump");
                        });
                    }
                )
                .subscribe();
        </script>
    </body>
</html>
